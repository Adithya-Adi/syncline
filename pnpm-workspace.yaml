packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 gates postinstall scripts. Add entries here as deps that need them arrive
# (prisma, esbuild) — `pnpm approve-builds` writes them for you.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  less: true
  msgpackr-extract: set this to true or false
  nx: true
  prisma: true
  unrs-resolver: true
  workerd: set this to true or false
  '@nestjs/core': false
