name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # nx affected and format:check both diff against a base, so they need history.
          fetch-depth: 0

      # pnpm has to be on PATH before setup-node, or `cache: pnpm` has no store to cache.
      # The version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # --frozen-lockfile is the point of running this in CI: a lockfile that does not match
      # package.json should fail here rather than resolve to something nobody tested.
      #
      # This also runs the root postinstall, which regenerates the Prisma client. That client is
      # gitignored, so without it nothing typechecks.
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx format:check

      # Only targets that exist. `lint` and `e2e` are configured nowhere yet, and asking Nx for a
      # target no project defines makes the failure look like a broken pipeline rather than an
      # absent one.
      - run: pnpm exec nx run-many -t typecheck build test
        env:
          # Build-time only, and deliberately not a real secret. Better Auth logs a warning when
          # the secret is unset, which is noise in a job that never signs anyone in; the running
          # app reads the real value from its own environment.
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret
