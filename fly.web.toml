# The dashboard and the viewer.
#
#   fly deploy -c fly.web.toml
#
# ONE MACHINE. Do not scale this app.
#
# A freshly minted secret key is held in memory on the machine that created it, deliberately —
# storing it would defeat the point of hashing, since the whole reason it is shown once is that we
# keep no copy (see `takeRevealedSecret` in apps/web/lib/projects.ts). Creating a project redirects,
# and with more than one machine that redirect can land on a different one, where the secret does
# not exist. The user then has to rotate a key they never got to read.
#
# Fixing that properly means moving the stash to Redis with a short TTL. Until then this app runs
# alone, and `min_machines_running = 1` with autostop off is what keeps the machine that holds the
# stash alive between the create and the redirect.

app = 'syncline-web'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'web'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  # Next.js rendering, and the viewer inflates rrweb chunks server-side. 512mb is where this starts
  # getting OOM-killed on a busy recording.
  memory = '1gb'
